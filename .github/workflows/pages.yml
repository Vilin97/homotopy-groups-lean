name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'website/**'
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  # Do not interrupt a production publish when result-bot commits arrive close
  # together; the next queued run will deploy the fresher artifact afterward.
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # actions/checkout v7.0.1, pinned 2026-07-30.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install digest-verified Node toolchain
        run: bash scripts/install_pinned_node.sh

      - name: Verify workflow pins and generated site data
        run: |
          /usr/bin/python3 scripts/action_pin_audit.py
          /usr/bin/python3 scripts/generate_site_data.py --check

      - name: Build and validate the static site
        working-directory: website
        run: |
          npm ci
          npm run lint
          npm test

      # actions/upload-pages-artifact v5.0.0, pinned 2026-07-30.
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: website/dist/client
          include-hidden-files: true

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # actions/deploy-pages v5.0.0, pinned 2026-07-30.
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
